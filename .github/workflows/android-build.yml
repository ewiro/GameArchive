name: Android release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and publish release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release configuration
        env:
          APP_CONFIG_BASE64: ${{ secrets.APP_CONFIG_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PROPERTIES_BASE64: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES_BASE64 }}
        run: |
          for secret_name in APP_CONFIG_BASE64 RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PROPERTIES_BASE64; do
            if [[ -z "${!secret_name}" ]]; then
              echo "::error::Missing required secret: ${secret_name}"
              exit 1
            fi
          done

          printf '%s' "$APP_CONFIG_BASE64" | base64 --decode > app/src/main/java/com/example/gamearchive/AppConfig.kt
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          printf '%s' "$RELEASE_KEYSTORE_PROPERTIES_BASE64" | base64 --decode > keystore.properties

      - name: Compile release APK
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Telegram release
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          metadata_path="app/build/outputs/apk/release/output-metadata.json"
          version_name="$(jq -r '.elements[0].versionName // empty' "$metadata_path")"
          if [[ -z "$version_name" ]]; then
            echo "::error::Unable to read versionName from release metadata"
            exit 1
          fi

          short_sha="${GITHUB_SHA:0:7}"
          base_name="GameArchive-v${version_name#v}-${short_sha}"
          mkdir -p telegram-release
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "telegram-release/${base_name}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk "telegram-release/${base_name}-armeabi-v7a.apk"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            changelog="$(git log --reverse --format='• %s' "${PUSH_BEFORE}..${GITHUB_SHA}")"
          else
            changelog="$(git log -1 --format='• %s' "$GITHUB_SHA")"
          fi

          caption="更新日志：
          ${changelog}"
          printf '%s' "${caption:0:1000}" > telegram-release/caption.txt
          printf 'BASE_NAME=%s\n' "$base_name" >> "$GITHUB_ENV"

      - name: Publish to Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "::error::Missing Telegram secrets"
            exit 1
          fi

          api_url="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMediaGroup"
          caption="$(<telegram-release/caption.txt)"
          media="$(jq -nc --arg caption "$caption" '[
            {type: "document", media: "attach://arm64"},
            {type: "document", media: "attach://armeabi", caption: $caption}
          ]')"
          response="$(curl --silent --show-error \
            --form-string "chat_id=${TELEGRAM_CHAT_ID}" \
            --form-string "media=${media}" \
            --form "arm64=@telegram-release/${BASE_NAME}-arm64-v8a.apk" \
            --form "armeabi=@telegram-release/${BASE_NAME}-armeabi-v7a.apk" \
            "$api_url")"
          if [[ "$(jq -r '.ok // false' <<< "$response")" != "true" ]]; then
            echo "::error::Telegram publish failed: $(jq -r '.description // "Unknown error"' <<< "$response")"
            exit 1
          fi
